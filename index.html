<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JavaScript Unit 4 Quiz – Set 2</title>
<style>
:root{--bg:#f3f5fa;--card:#fff;--ink:#1a2236;--mute:#667085;--line:#dfe3ec;--ac:#3b5bdb;--ac2:#7048e8;--ok:#12803c;--okbg:#e6f6ec;--bad:#b42318;--badbg:#fdecea;--sh:0 10px 30px rgba(30,45,90,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f121a;--card:#181d28;--ink:#e8ebf2;--mute:#9aa3b5;--line:#2a3142;--ac:#7d9bff;--ac2:#a78bfa;--ok:#5fd68a;--okbg:#14301f;--bad:#ff8a80;--badbg:#3a1a18;--sh:0 10px 30px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f121a;--card:#181d28;--ink:#e8ebf2;--mute:#9aa3b5;--line:#2a3142;--ac:#7d9bff;--ac2:#a78bfa;--ok:#5fd68a;--okbg:#14301f;--bad:#ff8a80;--badbg:#3a1a18;--sh:0 10px 30px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(1200px 500px at 50% -200px,color-mix(in srgb,var(--ac) 14%,transparent),transparent),var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
.wrap{max-width:760px;margin:0 auto;padding:22px 16px 56px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;margin-bottom:18px}
.logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;display:grid;place-items:center;font-weight:800;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:var(--sh)}
h1{font-size:1.7rem;margin:0 0 6px;line-height:1.2}
.mute{color:var(--mute)}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:18px 0}
.chip{border:1px solid var(--line);border-radius:12px;padding:12px 14px}.chip b{display:block;font-size:1.3rem}
ul.rules{padding-left:20px;color:var(--mute);margin:10px 0 20px}
.btn{font:inherit;font-weight:600;border:0;border-radius:10px;padding:12px 24px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;cursor:pointer;transition:transform .15s,box-shadow .15s,opacity .15s}
.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 16px rgba(59,91,219,.35)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sec:hover:not(:disabled){box-shadow:none;border-color:var(--ac)}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.top{margin-bottom:14px}.meta{display:flex;justify-content:space-between;align-items:center;font-size:.9rem;margin-bottom:8px}
.tag{background:color-mix(in srgb,var(--ac) 14%,transparent);color:var(--ac);font-weight:700;border-radius:99px;padding:3px 12px;font-size:.8rem}
.track{height:8px;background:var(--line);border-radius:99px;overflow:hidden}.track i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.q{font-size:1.1rem;font-weight:650;white-space:pre-wrap;margin:0 0 18px}
.q.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1rem;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:transparent;color:inherit;font:inherit;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;cursor:pointer;transition:border-color .15s,transform .15s,background .15s}
.opt:hover{border-color:var(--ac);transform:translateX(3px)}
.opt .k{flex:none;width:28px;height:28px;border-radius:8px;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:.85rem;transition:.15s}
.opt.sel{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 9%,transparent)}
.opt.sel .k{background:var(--ac);border-color:var(--ac);color:#fff}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.slideR{animation:inR .35s cubic-bezier(.2,.8,.2,1)}.slideL{animation:inL .35s cubic-bezier(.2,.8,.2,1)}
@keyframes inR{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
.pop{animation:pop .5s cubic-bezier(.2,.8,.2,1) both}
.task{background:var(--bg);border:1px solid var(--line);border-left:4px solid var(--ac);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.92rem;margin-bottom:12px}.kv span:nth-child(odd){color:var(--mute);font-weight:600}
code,.ex{font-family:ui-monospace,Menlo,Consolas,monospace}
.ex{display:block;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin:4px 0;font-size:.88rem;overflow-x:auto;white-space:pre}
textarea{width:100%;min-height:150px;resize:vertical;font:.92rem/1.5 ui-monospace,Menlo,Consolas,monospace;background:var(--bg);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:12px;tab-size:2}
textarea:focus{border-color:var(--ac)}
.run{display:flex;align-items:center;gap:12px;margin-top:10px;flex-wrap:wrap}
.out .t{font-size:.88rem;padding:6px 10px;border-radius:8px;margin-top:6px;font-family:ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap}
.t.ok{background:var(--okbg);color:var(--ok)}.t.bad{background:var(--badbg);color:var(--bad)}
.ring{position:relative;width:170px;height:170px;margin:6px auto}.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:12;stroke-linecap:round}.ring .bg{stroke:var(--line)}.ring .fg{stroke:url(#g);transition:stroke-dashoffset 1.4s cubic-bezier(.2,.8,.2,1)}
.ring .n{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font-size:2.2rem;font-weight:800;line-height:1.1}.ring .n small{font-size:.85rem;font-weight:500;color:var(--mute)}
.pill{display:inline-block;padding:5px 22px;border-radius:99px;font-weight:800;letter-spacing:.05em}.pill.ok{background:var(--okbg);color:var(--ok)}.pill.bad{background:var(--badbg);color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin:18px 0}
.stats div{border:1px solid var(--line);border-radius:12px;padding:10px}.stats b{display:block;font-size:1.25rem}
details{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:var(--card)}
summary{cursor:pointer;padding:12px 14px;font-weight:600;list-style:none;display:flex;gap:10px}summary::-webkit-details-marker{display:none}
details>div{padding:0 14px 14px;font-size:.93rem}
details pre{margin:6px 0;white-space:pre-wrap;font:.88rem/1.45 ui-monospace,Menlo,Consolas,monospace;background:var(--bg);border-radius:8px;padding:8px 10px}
.m{flex:none;font-weight:800}.m.ok{color:var(--ok)}.m.bad{color:var(--bad)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<div class="brand"><div class="logo">JS</div><span>JavaScript Unit 4 · Practice Test 2</span></div>
<div id="app"></div>
</div>
<script>
const M=[
["Which symbol is used in an arrow function?","=>","->","==>","::"],
["const add = (a, b) => a + b;\nconsole.log(add(2, 3));","5","23","undefined","NaN"],
["const [x, y] = [10, 20];\nconsole.log(y);","20","10","undefined","[10, 20]"],
["const { age } = { age: 25 };\nconsole.log(age);","25","age","undefined","Error"],
["What do the three dots do in [...a, 4]?","Spread the items of a","Delete a","Compare values","Create a loop"],
["function f(...nums) { return nums.length; }\nconsole.log(f(1, 2, 3));","3","1","0","undefined"],
["Which keyword pauses an async function until a promise settles?","await","pause","yield","stop"],
["Which block catches an error?","catch","finally","else","throw"],
["Which keyword creates an error on purpose?","throw","raise","error","try"],
["[1, 2, 3].map(x => x + 1)","[2, 3, 4]","[1, 2, 3]","6","[1, 3, 5]"],
["[5, 8, 12].filter(x => x > 6)","[8, 12]","[5]","[5, 8, 12]","2"],
["[2, 3].reduce((a, b) => a * b, 1)","6","5","1","[6]"],
["[4, 7, 9].find(x => x > 5) returns:","7","4","9","[7]"],
["Object.keys({ x: 1, y: 2 }).length","2","1","0","undefined"],
["const p = { n: 1 };\nconsole.log(p?.q?.r);","undefined","TypeError","null","0"],
["console.log(null ?? \"hi\");","hi","null","undefined","\"\""],
["What does Promise.resolve(5) create?","A promise fulfilled with 5","A plain number 5","An error","An array"],
["Which method runs when a promise succeeds?",".then()",".catch()",".fail()",".error()"],
["const o = { a: 1 };\nconst c = { ...o, b: 2 };\nconsole.log(c.b);","2","1","undefined","Error"],
["Which method returns -1 when no item matches?","findIndex()","find()","filter()","map()"]
];
const AS=["getNumber","asyncAdd"];
// [question, fnName, params, [[args, expected]...], sample solution]
const P=[
["Create an arrow function named addThree. It receives three numbers (a, b and c) and returns their sum.","addThree","a, b, c",[[[1,2,3],6],[[0,0,5],5]],"const addThree = (a, b, c) => a + b + c;"],
["Create a function named double. It receives a number (n) and returns n multiplied by 2.","double","n",[[[4],8],[[-2],-4]],"const double = n => n * 2;"],
["Create a function named isPositive. It receives a number (n). Return true if n is greater than 0, otherwise false.","isPositive","n",[[[5],true],[[-1],false]],"const isPositive = n => n > 0;"],
["Create a function named greet. It receives a name (name) and returns \"Hello, \" followed by the name. Example: Hello, Ravi","greet","name",[[["Ravi"],"Hello, Ravi"],[["Mia"],"Hello, Mia"]],"const greet = name => `Hello, ${name}`;"],
["Create a function named last. It receives an array (arr) and returns its last item.","last","arr",[[[[1,2,3]],3],[[["a","b"]],"b"]],"const last = arr => arr[arr.length - 1];"],
["Create a function named second. It receives an array (arr). Use array destructuring to return the second item.","second","arr",[[[[7,8,9]],8],[[["x","y"]],"y"]],"const second = arr => { const [, b] = arr; return b; };"],
["Create a function named getAge. It receives an object (person) with an age property. Use object destructuring to return age.","getAge","person",[[[{age:20}],20],[[{name:"Sam",age:9}],9]],"const getAge = ({ age }) => age;"],
["Create a function named countArgs that uses a rest parameter (...args) and returns how many arguments were passed.","countArgs","...args",[[[1,2,3],3],[[],0]],"const countArgs = (...args) => args.length;"],
["Create a function named joinArrays. It receives two arrays (a and b). Use the spread operator to return one new array with all items of a then b.","joinArrays","a, b",[[[[1,2],[3]],[1,2,3]],[[[],[]],[]]],"const joinArrays = (a, b) => [...a, ...b];"],
["Create a function named copyArray. It receives an array (arr). Use the spread operator to return a copy of it.","copyArray","arr",[[[[1,2]],[1,2]],[[[]],[]]],"const copyArray = arr => [...arr];"],
["Create a function named addActive. It receives an object (obj). Use spread to return a new object with all properties of obj plus active: true.","addActive","obj",[[[{a:1}],{a:1,active:true}],[[{}],{active:true}]],"const addActive = obj => ({ ...obj, active: true });"],
["Create a function named doubleAll. It receives an array of numbers (arr). Use map() to return a new array with every number doubled.","doubleAll","arr",[[[[1,2,3]],[2,4,6]],[[[]],[]]],"const doubleAll = arr => arr.map(x => x * 2);"],
["Create a function named onlyOdd. It receives an array of numbers (arr). Use filter() to return only the odd numbers.","onlyOdd","arr",[[[[1,2,3,4]],[1,3]],[[[2,4]],[]]],"const onlyOdd = arr => arr.filter(x => x % 2 !== 0);"],
["Create a function named sumArray. It receives an array of numbers (arr). Use reduce() to return the sum (0 for an empty array).","sumArray","arr",[[[[1,2,3]],6],[[[]],0]],"const sumArray = arr => arr.reduce((a, b) => a + b, 0);"],
["Create a function named firstNegative. It receives an array of numbers (arr). Use find() to return the first number below 0, or undefined if none.","firstNegative","arr",[[[[3,-2,-5]],-2],[[[1,2]],undefined]],"const firstNegative = arr => arr.find(x => x < 0);"],
["Create a function named lengths. It receives an array of strings (arr). Use map() to return an array with the length of each string.","lengths","arr",[[[["hi","hello"]],[2,5]],[[[]],[]]],"const lengths = arr => arr.map(s => s.length);"],
["Create a function named indexOfBig. It receives an array of numbers (arr). Use findIndex() to return the index of the first number greater than 10 (-1 if none).","indexOfBig","arr",[[[[1,20,30]],1],[[[1,2]],-1]],"const indexOfBig = arr => arr.findIndex(x => x > 10);"],
["Create a function named getCountry. It receives an object (user) that may have an address object with a country. Use optional chaining (?.) to return the country, or undefined if missing.","getCountry","user",[[[{address:{country:"India"}}],"India"],[[{}],undefined]],"const getCountry = user => user?.address?.country;"],
["Create a function named defaultName. It receives a value (name). Use the ?? operator to return name, or \"Guest\" if name is null or undefined.","defaultName","name",[[[null],"Guest"],[["Ana"],"Ana"]],"const defaultName = name => name ?? \"Guest\";"],
["Create a function named getKeys. It receives an object (obj) and returns an array of its keys.","getKeys","obj",[[[{a:1,b:2}],["a","b"]],[[{}],[]]],"const getKeys = obj => Object.keys(obj);"],
["Create a function named getValues. It receives an object (obj) and returns an array of its values.","getValues","obj",[[[{a:1,b:2}],[1,2]],[[{}],[]]],"const getValues = obj => Object.values(obj);"],
["Create a function named pairs. It receives an object (obj) and returns its [key, value] pairs. Hint: Object.entries().","pairs","obj",[[[{a:1}],[["a",1]]],[[{}],[]]],"const pairs = obj => Object.entries(obj);"],
["Create a function named isEmptyObj. It receives an object (obj). Return true if it has no keys, otherwise false.","isEmptyObj","obj",[[[{}],true],[[{a:1}],false]],"const isEmptyObj = obj => Object.keys(obj).length === 0;"],
["Create an async function named getNumber with no parameters. It must return the number 42.","getNumber","",[[[],42]],"const getNumber = async () => 42;"],
["Create an async function named asyncAdd. It receives two numbers (a and b) and returns their sum.","asyncAdd","a, b",[[[2,3],5],[[10,-4],6]],"const asyncAdd = async (a, b) => a + b;"],
["Create a function named safeDivide. It receives two numbers (a and b) and returns a / b. If b is 0, throw a new Error with the message \"Cannot divide by zero\".","safeDivide","a, b",[[[10,2],5],[[1,0],{err:"Cannot divide by zero"}]],"const safeDivide = (a, b) => {\n  if (b === 0) throw new Error(\"Cannot divide by zero\");\n  return a / b;\n};"],
["Create a function named safeParse. It receives a JSON string (str). Use try/catch: return JSON.parse(str) if valid, or null if invalid.","safeParse","str",[[['{"a":1}'],{a:1}],[["{bad"],null]],"const safeParse = str => {\n  try { return JSON.parse(str); }\n  catch (e) { return null; }\n};"],
["Create a function named checkAge. It receives a number (age). If age is below 18, throw a new Error with the message \"Too young\". Otherwise return \"OK\".","checkAge","age",[[[20],"OK"],[[10],{err:"Too young"}]],"const checkAge = age => {\n  if (age < 18) throw new Error(\"Too young\");\n  return \"OK\";\n};"],
["Create a function named totalPrice. It receives an array of objects like { price: 10 }. Use reduce() to return the sum of all prices (0 for an empty array).","totalPrice","items",[[[[{price:10},{price:5}]],15],[[[]],0]],"const totalPrice = items => items.reduce((s, i) => s + i.price, 0);"],
["Create a function named minOf. It receives an array of numbers (arr). Use the spread operator with Math.min() to return the smallest number.","minOf","arr",[[[[4,2,9]],2],[[[-1,3]],-1]],"const minOf = arr => Math.min(...arr);"]
];
const MN=M.length,PN=P.length;
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const E=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const J=v=>v===undefined?"undefined":JSON.stringify(v);
const fmt=(n,a,e)=>`${n}(${a.map(J).join(", ")})  →  ${e&&e.err?"throws Error: "+e.err:J(e)}`;
const items=[...sh(M).map(m=>({t:"m",q:m[0],c:m[1],o:sh(m.slice(1)),a:null})),
 ...sh(P).map(p=>({t:"p",q:p[0],n:p[1],pa:p[2],tt:p[3],s:p[4],code:"const "+p[1]+" = "+(AS.includes(p[1])?"async ":"")+"("+p[2]+") => {\n  // write your code here\n};",out:""}))];
items.forEach(x=>{if(x.t==="p")x.start=x.code});
const N=items.length,app=document.getElementById("app");let i=0,dir=1,done=false;
const answered=x=>x.t==="m"?x.a!==null:x.code!==x.start;
async function runTests(x){const rows=[];let ok=true;
 try{const f=new Function(x.code+"\nreturn "+x.n+";")();if(typeof f!=="function")throw new Error("Define a function named "+x.n);
  for(const[a,e]of x.tt){let r;try{r=await f(...a)}catch(z){r={err:z.message}}const p=J(r)===J(e);if(!p)ok=false;rows.push(`<div class="t ${p?"ok":"bad"}">${p?"✓":"✗"} ${E(fmt(x.n,a,e))}${p?"":"\n   your output: "+E(r&&r.err?"throws Error: "+r.err:J(r))}</div>`)}
 }catch(z){ok=false;rows.push(`<div class="t bad">✗ ${E(z.message)}</div>`)}
 return{ok,html:rows.join("")}}
function start(){app.innerHTML=`<div class="card pop"><h1>Ready for Practice Test 2?</h1><p class="mute">Arrow functions, destructuring, spread &amp; rest · Async &amp; error handling · Objects &amp; optional chaining · map, filter, reduce &amp; find</p>
<div class="chips"><div class="chip"><b>${MN}</b>Multiple-choice</div><div class="chip"><b>${PN}</b>Easy programs</div><div class="chip"><b>${N}</b>Total marks</div></div>
<ul class="rules"><li>One question at a time — press <b>Next</b> to move on, or <b>Previous</b> to go back.</li><li>MCQ: 1 mark each. Programs: 1 mark if all test cases pass.</li><li>For programs, use <b>Run tests</b> to check your code before moving on.</li><li>Question order is shuffled every time. Pass mark: 50%.</li></ul>
<button class="btn" id="go">Start test →</button></div>`;document.getElementById("go").onclick=()=>{i=0;draw()}}
function draw(){const x=items[i],last=i===N-1;let body;
 if(x.t==="m"){body=`<div class="q${/[=(\[{]/.test(x.q)&&x.q.length<130?" code":""}">${E(x.q)}</div>`+x.o.map((o,j)=>`<button class="opt${x.a===j?" sel":""}" data-j="${j}"><span class="k">${"ABCD"[j]}</span><span>${E(o)}</span></button>`).join("")}
 else{const ex=x.tt.slice(0,2).map(([a,e])=>`<code class="ex">${E(fmt(x.n,a,e))}</code>`).join("");
  body=`<div class="task"><b>Task:</b> ${E(x.q)}</div><div class="kv"><span>Function name</span><code>${x.n}</code><span>Input</span><code>${x.pa?E(x.pa):"(none)"}</code></div><div class="mute" style="font-size:.9rem">Examples (call → expected result):</div>${ex}
  <div class="mute" style="margin:12px 0 6px;font-size:.9rem">Write your code:</div><textarea id="code" spellcheck="false" autocapitalize="off">${E(x.code)}</textarea><div class="run"><button class="btn sec" id="run">▶ Run tests</button><span class="mute" style="font-size:.85rem">Tab key indents</span></div><div class="out" id="out">${x.out}</div>`}
 app.innerHTML=`<div class="top"><div class="meta"><span class="tag">${x.t==="m"?"PART A · MCQ":"PART B · PROGRAM"}</span><span class="mute">Question <b>${i+1}</b> of ${N} · ${items.filter(answered).length} answered</span></div><div class="track"><i style="width:${i/N*100}%"></i></div></div>
 <div class="card ${dir>0?"slideR":"slideL"}">${body}<div class="nav"><button class="btn sec" id="pv" ${i?"":"disabled"}>← Previous</button><button class="btn" id="nx">${last?"Finish test ✓":"Next →"}</button></div></div>`;
 requestAnimationFrame(()=>app.querySelector(".track i").style.width=(i+1)/N*100+"%");
 document.getElementById("pv").onclick=()=>{dir=-1;i--;draw()};
 document.getElementById("nx").onclick=()=>last?finish():(dir=1,i++,draw(),scrollTo({top:0,behavior:"smooth"}));
 if(x.t==="m")app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{x.a=+b.dataset.j;app.querySelectorAll(".opt").forEach((o,k)=>o.classList.toggle("sel",k===x.a))});
 else{const ta=document.getElementById("code");ta.oninput=()=>x.code=ta.value;
  ta.onkeydown=e=>{if(e.key==="Tab"){e.preventDefault();ta.setRangeText("  ",ta.selectionStart,ta.selectionEnd,"end");x.code=ta.value}};
  document.getElementById("run").onclick=async()=>{const o=document.getElementById("out");o.innerHTML='<div class="t">Running…</div>';const r=await runTests(x);x.out=r.html;o.innerHTML=r.html}}}
document.addEventListener("keydown",e=>{const x=items[i];if(done||!x||x.t!=="m"||!document.querySelector(".opt"))return;const k="abcd".indexOf(e.key.toLowerCase()),n=+e.key-1,j=k>=0?k:n;if(e.key.length===1&&j>=0&&j<4){document.querySelectorAll(".opt")[j].click()}else if(e.key==="ArrowRight"||e.key==="Enter")document.getElementById("nx").click()});
async function finish(){const un=items.filter(x=>!answered(x)).length;if(un&&!confirm(un+" question(s) are unanswered and will score 0. Finish anyway?"))return;
 done=true;app.innerHTML='<div class="card pop" style="text-align:center">Checking your answers…</div>';let ma=0,pa=0;
 for(const x of items){if(x.t==="m"){x.ok=x.o[x.a]===x.c;if(x.ok)ma++}else{x.ok=(await runTests(x)).ok;if(x.ok)pa++}}
 const tot=ma+pa,pct=Math.round(tot/N*100),pass=pct>=50,g=pct>=90?"A+":pct>=80?"A":pct>=70?"B":pct>=60?"C":pct>=50?"D":"F",C=2*Math.PI*72;
 app.innerHTML=`<div class="card pop" style="text-align:center"><h1>${pass?"Well done! 🎉":"Keep practising 💪"}</h1><p class="mute">Your test is complete</p>
 <div class="ring"><svg width="170" height="170" viewBox="0 0 170 170"><defs><linearGradient id="g"><stop offset="0" stop-color="#3b5bdb"/><stop offset="1" stop-color="#7048e8"/></linearGradient></defs><circle class="bg" cx="85" cy="85" r="72"/><circle class="fg" id="fg" cx="85" cy="85" r="72" stroke-dasharray="${C}" stroke-dashoffset="${C}"/></svg><div class="n"><span id="cnt">0</span><small>out of ${N}</small></div></div>
 <div class="pill ${pass?"ok":"bad"}">${pass?"PASS":"FAIL"}</div>
 <div class="stats"><div><b>${pct}%</b>Percentage</div><div><b>${g}</b>Grade</div><div><b>${ma} / ${MN}</b>MCQ marks</div><div><b>${pa} / ${PN}</b>Program marks</div></div>
 <button class="btn" id="re">↻ Retake (new order)</button></div><h2 style="margin:26px 0 12px">Review your answers</h2>`+
 items.map((x,k)=>`<details class="pop" ${x.ok?"":"open"}><summary><span class="m ${x.ok?"ok":"bad"}">${x.ok?"✓":"✗"}</span><span>${k+1}. ${E(x.q.length>90?x.q.slice(0,90)+"…":x.q)}</span></summary><div>`+(x.t==="m"?`<pre>${E(x.q)}</pre>Your answer: <b>${x.a===null?"not answered":E(x.o[x.a])}</b><br>Correct answer: <b>${E(x.c)}</b>`:`<pre>${E(x.q)}</pre>Your code:<pre>${E(x.code)}</pre>Sample solution:<pre>${E(x.s)}</pre>`)+`</div></details>`).join("");
 document.getElementById("re").onclick=()=>location.reload();scrollTo({top:0});
 requestAnimationFrame(()=>requestAnimationFrame(()=>document.getElementById("fg").style.strokeDashoffset=C*(1-tot/N)));
 let c=0;const t=setInterval(()=>{c++;document.getElementById("cnt").textContent=c;if(c>=tot)clearInterval(t)},tot?1300/tot:0)}
start();
</script>
</body>
</html>
